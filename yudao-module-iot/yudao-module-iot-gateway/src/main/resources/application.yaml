spring:
  application:
    name: iot-gateway-server
  profiles:
    active: local # 默认激活本地开发环境

  # Redis 配置
  redis:
    host: 127.0.0.1 # Redis 服务器地址
    port: 6379 # Redis 服务器端口
    database: 0 # Redis 数据库索引
    # password: # Redis 密码，如果有的话
    timeout: 5000ms # 命令超时时间：Redis 不可用时，离线暂存的直发最多等待该时间后写入暂存（需大于消费 Stream 的阻塞读取时间 2 秒）
    connect-timeout: 5000ms # 连接超时时间
  # Kafka 配置项，对应 KafkaProperties 配置类
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # 指定 Kafka Broker 地址，可以设置多个，以逗号分隔
    producer:
      properties:
        max.block.ms: 5000 # 等待元数据、发送缓冲区的最长时间：Kafka 不可用时，发送最多阻塞该时间
        request.timeout.ms: 5000 # 单次请求等待 broker 响应的超时时间
        delivery.timeout.ms: 10000 # 发送（含重试）的总超时时间：超时按未确认处理，离线暂存保留（可能重复，不会丢失）；需不小于 linger.ms + request.timeout.ms
  # RabbitMQ 配置项，对应 RabbitProperties 配置类
  rabbitmq:
    host: 127.0.0.1 # RabbitMQ 服务的地址
    port: 5672 # RabbitMQ 服务的端口
    username: guest # RabbitMQ 服务的账号
    password: guest # RabbitMQ 服务的密码
    connection-timeout: 5s # 连接超时时间：RabbitMQ 不可用时，发送最多等待该时间建立连接
    publisher-confirm-type: correlated # 开启 publisher confirm：离线暂存的确认发送需要
    publisher-returns: true # 开启 return：离线暂存的确认发送需要，判断消息是否无法路由
    template:
      mandatory: false # 普通发送保持不开启 mandatory（publisher-returns 开启时默认为 true）；确认发送使用独立的 RabbitTemplate

--- #################### 消息队列相关 ####################

# rocketmq 配置项，对应 RocketMQProperties 配置类
rocketmq:
  name-server: 127.0.0.1:9876 # RocketMQ Namesrv
  # Producer 配置项
  producer:
    group: ${spring.application.name}_PRODUCER # 生产者分组

--- #################### IoT 网关相关配置 ####################

yudao:
  iot:
    # 消息总线配置
    message-bus:
      type: redis # 消息总线的类型
      confirm-timeout: 5s # 确认发送等待 broker 确认的超时时间（RabbitMQ 的 publisher confirm）：超时按未确认处理，离线暂存保留

    # 网关配置
    gateway:
      # 设备 RPC 配置
      rpc:
        url: http://127.0.0.1:48080 # 主程序 API 地址
        connect-timeout: 30s
        read-timeout: 30s
      # 设备 Token 配置
      token:
        secret: yudaoIotGatewayTokenSecret123456789 # Token 密钥，至少32位
        expiration: 7d
      # 离线暂存配置：消息总线不可用时，各协议的属性、事件、批量上报暂存到本地 SQLite，恢复后补传
      spool:
        enabled: false # 是否开启：支持 Redis、Kafka、RocketMQ、RabbitMQ 消息总线（RabbitMQ 需开启上面的 publisher confirm、return）；Local 为进程内，不生效
        file: data/iot-gateway-spool.db # SQLite 文件路径
        max-size: 2GB # 暂存消息的最大字节数，超过时拒绝新消息
        max-age: 7d # 暂存消息的最长保留时间，超过时删除
        drain-rate: 200 # 每秒最多补传的消息数

      # 协议实例列表
      protocols:
        # ====================================
        # 针对引入的 HTTP 组件的配置
        # ====================================
        - id: http-json
          protocol: http
          port: 8092
          enabled: false
        # ====================================
        # 针对引入的 TCP 组件的配置
        # ====================================
        - id: tcp-json
          enabled: false
          protocol: tcp
          port: 8091
          serialize: json
          tcp:
            max-connections: 1000
            keep-alive-timeout-ms: 30000
            codec:
              type: delimiter              # 拆包类型：length_field / delimiter / fixed_length
              delimiter: "\\n"             # 分隔符（支持转义：\\n=换行, \\r=回车, \\t=制表符）
#              type: length_field           # 拆包类型：length_field / delimiter / fixed_length
#              length-field-offset: 0       # 长度字段偏移量
#              length-field-length: 4       # 长度字段长度
#              length-adjustment: 0         # 长度调整值
#              initial-bytes-to-strip: 4    # 初始跳过的字节数
#              type: fixed_length           # 拆包类型：length_field / delimiter / fixed_length
#              fixed-length: 256            # 固定长度
        # ====================================
        # 针对引入的 UDP 组件的配置
        # ====================================
        - id: udp-json
          enabled: false
          protocol: udp
          port: 8093
          serialize: json
          udp:
            max-sessions: 1000               # 最大会话数
            session-timeout-ms: 60000        # 会话超时时间（毫秒），基于 Guava Cache 自动过期
            receive-buffer-size: 65536       # 接收缓冲区大小（字节）
            send-buffer-size: 65536          # 发送缓冲区大小（字节）
        # ====================================
        # 针对引入的 WebSocket 组件的配置
        # ====================================
        - id: websocket-json
          enabled: false
          protocol: websocket
          port: 8094
          serialize: json
          websocket:
            path: /ws
            max-message-size: 65536          # 最大消息大小（字节，默认 64KB）
            max-frame-size: 65536            # 最大帧大小（字节，默认 64KB）
            idle-timeout-seconds: 60         # 空闲超时时间（秒，默认 60）
        # ====================================
        # 针对引入的 CoAP 组件的配置
        # ====================================
        - id: coap-json
          enabled: false
          protocol: coap
          port: 5683
          coap:
            max-message-size: 1024           # 最大消息大小（字节）
            ack-timeout-ms: 2000             # ACK 超时时间（毫秒）
            max-retransmit: 4                # 最大重传次数
        # ====================================
        # 针对引入的 MQTT 组件的配置
        # ====================================
        - id: mqtt-json
          enabled: false
          protocol: mqtt
          port: 1883
          serialize: json
          mqtt:
            max-message-size: 8192           # 最大消息大小（字节）
            connect-timeout-seconds: 60      # 连接超时时间（秒）
        # ====================================
        # 针对引入的 EMQX 组件的配置
        # ====================================
        - id: emqx-1
          enabled: false
          protocol: emqx
          port: 8090 # EMQX HTTP Hook 端口（/mqtt/auth、/mqtt/event）
          emqx:
            mqtt-host: 127.0.0.1                  # MQTT Broker 地址
            mqtt-port: 1883                       # MQTT Broker 端口
            mqtt-username: admin                  # MQTT 用户名
            mqtt-password: public                 # MQTT 密码
            mqtt-client-id: iot-gateway-mqtt      # MQTT 客户端 ID
            mqtt-ssl: false                       # 是否开启 SSL
            mqtt-topics:
              - "/sys/#"                          # 系统主题
            mqtt-qos: 1                           # 默认 QoS
            clean-session: true                   # 是否启用 Clean Session (默认: true)
            keep-alive-interval-seconds: 60       # 心跳间隔，单位秒 (默认: 60)
            max-inflight-queue: 10000             # 最大飞行消息队列，单位：条
            connect-timeout-seconds: 10           # 连接超时，单位：秒
            reconnect-delay-ms: 5000              # 重连延迟，单位：毫秒
            # 是否信任所有 SSL 证书 (默认: false)。警告：生产环境必须为 false！
            # 仅在开发环境或内网测试时，如果使用了自签名证书，可以临时设置为 true
            trust-all: true # 在 dev 环境可以设为 true
            # EMQX HTTP Hook 回调网关的 HTTPS 配置（可选）
            http:
              ssl-enabled: false
              # ssl-cert-path: "path/to/server.crt"
              # ssl-key-path: "path/to/server.key"
            # 遗嘱消息配置 (用于网关异常下线时通知其他系统)
            will:
              enabled: true # 生产环境强烈建议开启
              topic: "gateway/status/iot-gateway-mqtt" # 遗嘱消息主题
              payload: "offline" # 遗嘱消息负载
              qos: 1 # 遗嘱消息 QoS
              retain: true # 遗嘱消息是否保留
            # 高级 SSL/TLS 配置 (当 trust-all: false 且 mqtt-ssl: true 时生效)
            ssl-options:
              key-store-path: "classpath:certs/client.jks" # 客户端证书库路径
              key-store-password: "your-keystore-password" # 客户端证书库密码
              trust-store-path: "classpath:certs/trust.jks" # 信任的 CA 证书库路径
              trust-store-password: "your-truststore-password" # 信任的 CA 证书库密码
        # ====================================
        # 针对引入的 Modbus TCP Client 组件的配置
        # ====================================
        - id: modbus-tcp-client-1
          enabled: false
          protocol: modbus_tcp_client
          port: 502
          modbus-tcp-client:
            config-refresh-interval: 30  # 配置刷新间隔（秒）
        # ====================================
        # 针对引入的 Modbus TCP Server 组件的配置
        # ====================================
        - id: modbus-tcp-server-1
          enabled: false
          protocol: modbus_tcp_server
          port: 503
          modbus-tcp-server:
            config-refresh-interval: 30     # 配置刷新间隔（秒）
            custom-function-code: 65        # 自定义功能码（用于认证等扩展交互）
            min-request-interval: 1000      # 同一设备的最小轮询请求间隔（毫秒，小于等于 0 表示不限制）
            request-timeout: 5000           # Pending Request 超时时间（毫秒）
            request-cleanup-interval: 10000 # Pending Request 清理间隔（毫秒）
        # ====================================
        # 针对引入的 OPC UA Client 组件的配置（只读采集；单网关长连接，只部署一个启用该协议的网关实例）
        # ====================================
        - id: opc-ua-client-1
          enabled: false
          protocol: opc_ua_client
          port: 4841                        # 只用于生成 serverId，不监听端口
          opc-ua-client:
            config-refresh-interval: 30     # 配置刷新间隔（秒）
            state-retry-interval: 30        # 上下线消息发送失败后的重试间隔（秒）
            pki-dir: data/opc-ua/pki        # PKI 目录：own/client.pfx、trusted/certs、issuer/certs、rejected
            keystore-password: ${IOT_OPC_UA_KEYSTORE_PASSWORD:}  # 客户端 keystore 口令（必填，建议通过环境变量注入）
            keystore-alias: yudao-opc-ua-client # keystore 中客户端证书的别名（放入 CA 签发的证书时，私钥和证书链放在该别名下）
            application-name: Yudao IoT Gateway OPC UA Client # 应用名称（会话 ApplicationName、新生成证书的 CN；多网关时便于服务端区分）
            endpoint-host-rewrite: false    # 服务端返回的端点主机、端口与配置不一致时，是否改写为配置的
            max-nodes-per-read: 100         # 每次 Read 的最大节点数（与服务端 OperationLimits 取较小值）
            max-points-per-message: 100     # 每条属性上报消息的最大点位数
            max-message-bytes: 262144       # 每条属性上报消息的最大字节数
            max-monitored-items-per-call: 100 # 每次创建、删除 MonitoredItem 的最大数量
            subscription-keep-alive-count: 10
            subscription-lifetime-count: 30
            write-timeout: 10000            # 属性写入超时（毫秒），含排队、读取节点属性和写入
            max-pending-writes-per-device: 16 # 每个设备排队中的属性写入消息上限
            max-nodes-per-write: 100        # 每次 Write 的最大节点数（与服务端 OperationLimits 取较小值）
            credentials: {}                 # 用户名凭据（只支持用户名认证，设备必须引用这里的凭据别名），示例：
            #  plc-reader:                    # 凭据别名（设备配置的 credentialAlias）
            #    username: reader
            #    password: ${IOT_OPC_UA_PLC_READER_PASSWORD:}
            #    tenant-ids: [1]              # 允许使用的租户
            #    endpoints: ["opc.tcp://192.168.1.10:4840"] # 允许使用的端点
        # ====================================
        # 针对引入的 OPC UA Server 组件的配置（北向只读数据服务：节点只读、写入拒绝；单网关部署，默认关闭）
        # ====================================
        - id: opc-ua-server-1
          enabled: false
          protocol: opc_ua_server
          port: 4840                        # 监听端口
          opc-ua-server:
            config-refresh-interval: 30     # 配置刷新间隔（秒）
            bind-address: 0.0.0.0           # 监听地址
            hostname: localhost             # 端点主机名（上位机可访问的地址，也写入自签名证书 SAN）
            path: /yudao-iot                # 端点路径；发现端点为 <path>/discovery
            pki-dir: data/opc-ua-server/pki # PKI 目录：own/server.pfx、trusted/certs、issuer/certs、rejected
            keystore-password: ${IOT_OPC_UA_SERVER_KEYSTORE_PASSWORD:} # 服务端 keystore 口令（必填，建议通过环境变量注入）
            keystore-alias: yudao-opc-ua-server
            application-name: Yudao IoT Gateway OPC UA Server
            security-none-allowed: false    # 是否允许 None 安全策略的会话（只用于开发联调；仍然只允许用户名登录）
            max-sessions: 20                # 网关最大会话数（每个配置的会话数另受配置的最大会话数限制）
            max-subscriptions-per-session: 5      # 每个会话的最大订阅数上限
            max-monitored-items-per-session: 1000 # 每个会话的最大 MonitoredItem 数上限
            credentials: {}                 # 用户名凭据，示例：
            #  scada-a:                       # 凭据别名（OPC UA Server 配置的 credentialAlias）
            #    username: scada
            #    password: ${IOT_OPC_UA_SERVER_SCADA_A_PASSWORD:}
            #    tenant-ids: [1]              # 允许使用的租户

--- #################### 日志相关配置 ####################

# 基础日志配置
logging:
  file:
    name: ${user.home}/logs/${spring.application.name}.log # 日志文件名，全路径
  level:
    # 应用基础日志级别
    cn.iocoder.yudao.module.iot.gateway: INFO
    org.springframework.boot: INFO
    # RocketMQ 日志
    org.apache.rocketmq: WARN
    # MQTT 客户端日志
    # io.vertx.mqtt: DEBUG
    # 开发环境详细日志
    cn.iocoder.yudao.module.iot.gateway.protocol.emqx: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.http: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.mqtt: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.coap: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.websocket: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.modbus: DEBUG
    cn.iocoder.yudao.module.iot.gateway.protocol.opcua: DEBUG
    # 根日志级别
    root: INFO

debug: false
