# SRS：接收 Egress 推来的远端流，供小程序 live-player 拉取；推流与播放都经网关 HTTP 回调鉴权
# 本实例由网关独占：回调对整个 vhost 生效，网关只放行专用 app（yudao-mp-gw）下自己创建的流，勿与其它直播业务共用
# 默认只监听回环；真机联调时改为 listen 1936; 并在防火墙 / 安全组只放通需要的来源
listen              127.0.0.1:1936;
max_connections     200;
daemon              off;
srs_log_tank        console;

vhost __defaultVhost__ {
    # 低延迟：关闭合并写、开启 TCP_NODELAY；GOP 缓存让播放器首帧不必等下一个关键帧（Egress 关键帧间隔 1 秒）
    min_latency     on;
    tcp_nodelay     on;
    play {
        gop_cache       on;
        queue_length    10;
        mw_latency      100;
    }
    publish {
        mr              off;
    }
    # 网关回调端口只监听回环；网关不可用时 SRS 拒绝推流与播放
    http_hooks {
        enabled         on;
        on_publish      http://127.0.0.1:8091/srs/hooks/on_publish;
        on_unpublish    http://127.0.0.1:8091/srs/hooks/on_unpublish;
        on_play         http://127.0.0.1:8091/srs/hooks/on_play;
    }
}
