version: "3.4"

name: yudao-system

services:
  # 后端服务
  server:
    container_name: yudao-server
    build:
      context: ./yudao-server/
    image: yudao-server
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: >
        -Xms512m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
      ARGS: >
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://host.docker.internal:3309/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://host.docker.internal:3309/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=
        --spring.data.redis.host=host.docker.internal
        --spring.data.redis.port=6379
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # 前端管理端服务
  admin:
    container_name: yudao-admin
    build:
      context: ./yudao-ui-admin
      args:
        NODE_ENV: production
        VUE_APP_TITLE: 芋道管理系统
        VUE_APP_BASE_API: /prod-api
        VUE_APP_TENANT_ENABLE: "true"
        VUE_APP_CAPTCHA_ENABLE: "true"
        VUE_APP_DOC_ENABLE: "true"
        VUE_APP_BAIDU_CODE: fadc1bd5db1a1d6f581df60a1807f8ab
    image: yudao-admin
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
