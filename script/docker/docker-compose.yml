name: yudao-system

services:
  server:
    container_name: yudao-server
    image: yudao-server:latest
    restart: unless-stopped

    ports:
      - "48080:48080"

    networks:
      - dev-net

    environment:
      SPRING_PROFILES_ACTIVE: local

      JAVA_OPTS: >
        -Xms512m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom

      ARGS: >
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://dev-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=

        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://dev-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=

        --spring.data.redis.host=dev-redis
        --spring.data.redis.port=6379

networks:
  dev-net:
    external: true
