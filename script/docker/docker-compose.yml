name: yudao-system

services:
  mysql:
    container_name: yudao-mysql
    image: mysql:8
    restart: unless-stopped
    tty: true
    ports:
      - "3309:3306"
    environment:
      MYSQL_DATABASE: ruoyi-vue-pro
      MYSQL_ROOT_PASSWORD:
    volumes:
      - mysql:/var/lib/mysql
      - ./sql/mysql/ruoyi-vue-pro.sql:/docker-entrypoint-initdb.d/ruoyi-vue-pro.sql:ro

  redis:
    container_name: yudao-redis
    image: redis:6-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis:/data

  server:
    container_name: yudao-server
    image: yudao-server:latest
    restart: unless-stopped
    ports:
      - "48080:48080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      JAVA_OPTS: >
        -Xms512m
        -Xmx512m
        -Djava.security.egd=file:/dev/./urandom
      ARGS: >
        --spring.datasource.dynamic.datasource.master.url=jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.master.username=root
        --spring.datasource.dynamic.datasource.master.password=123456
        --spring.datasource.dynamic.datasource.slave.url=jdbc:mysql://yudao-mysql:3306/ruoyi-vue-pro?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
        --spring.datasource.dynamic.datasource.slave.username=root
        --spring.datasource.dynamic.datasource.slave.password=123456
        --spring.data.redis.host=yudao-redis
        --spring.data.redis.port=6379
    depends_on:
      - mysql
      - redis

volumes:
  mysql:
    driver: local

  redis:
    driver: local
